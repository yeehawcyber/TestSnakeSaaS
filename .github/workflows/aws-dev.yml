name: AWS dev Terraform from main

on:
  pull_request:
    paths:
      - ".github/workflows/aws-dev.yml"
      - "app/**"
      - "lib/**"
      - "public/**"
      - "Dockerfile"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply the reviewed plan after approval in the dev environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aws-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: 1.15.8
  TF_VAR_application_callback_url: ${{ vars.APPLICATION_CALLBACK_URL }}
  TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
  TF_VAR_cognito_domain_prefix: ${{ vars.COGNITO_DOMAIN_PREFIX }}
  TF_VAR_image_tag: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform/bootstrap init -backend=false
      - run: terraform -chdir=infra/terraform/bootstrap validate
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker buildx build --platform linux/amd64 --provenance=false --load --tag "testsnakesaas:${GITHUB_SHA}" .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: testsnakesaas:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  plan:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [validate, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.0.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "620649695133"
          role-session-name: github-plan-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Initialize remote state
        run: >-
          terraform -chdir=infra/terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=testsnakesaas/dev/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
          -backend-config="use_lockfile=true"
      - name: Create saved plan
        run: terraform -chdir=infra/terraform plan -lock=false -input=false -out=dev.tfplan
      - name: Run provider-backed Terraform tests
        run: |
          terraform -chdir=infra/terraform/bootstrap test
          terraform -chdir=infra/terraform test
      - name: Render plan
        run: terraform -chdir=infra/terraform show -no-color dev.tfplan | tee infra/terraform/plan.txt
      - name: Add plan to job summary
        shell: bash
        run: |
          {
            echo '## Terraform dev plan'
            echo '```terraform'
            sed -n '1,1000p' infra/terraform/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact saved plan
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-dev-plan-${{ github.run_id }}
          path: infra/terraform/dev.tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.0.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "620649695133"
          role-session-name: github-deploy-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-dev-plan-${{ github.run_id }}
          path: infra/terraform
      - name: Initialize remote state
        run: >-
          terraform -chdir=infra/terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=testsnakesaas/dev/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
          -backend-config="use_lockfile=true"
      - name: Publish immutable Lambda image when absent
        shell: bash
        run: |
          repository="${{ vars.ECR_REPOSITORY_URL }}"
          repository_name="${repository##*/}"
          if aws ecr describe-images --repository-name "$repository_name" --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "ECR image ${GITHUB_SHA} already exists; immutable tag will be reused."
          else
            aws ecr get-login-password --region "$AWS_REGION" |
              docker login --username AWS --password-stdin "${repository%%/*}"
            docker buildx build --platform linux/amd64 --provenance=false --load --tag "$repository:$GITHUB_SHA" .
            docker push "$repository:$GITHUB_SHA"
          fi
      - name: Apply exact reviewed plan
        run: terraform -chdir=infra/terraform apply -input=false -auto-approve dev.tfplan
      - name: Verify deployment health
        shell: bash
        run: |
          application_url="$(terraform -chdir=infra/terraform output -raw application_url)"
          curl --fail --show-error --silent --retry 5 --retry-all-errors "$application_url/api/health"
      - name: Confirm final state has no drift
        run: terraform -chdir=infra/terraform plan -detailed-exitcode -input=false
