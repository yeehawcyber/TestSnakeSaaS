name: AWS dev infrastructure and deployment

on:
  pull_request:
    paths:
      - ".github/workflows/aws-dev.yml"
      - "app/**"
      - "lib/**"
      - "public/**"
      - "Dockerfile"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy the selected commit or roll back to an existing ECR commit tag"
        required: true
        type: choice
        options:
          - deploy
          - rollback
      image_sha:
        description: "Required only for rollback: existing 40-character ECR commit tag"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testsnakesaas-dev-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: 1.15.8

jobs:
  validate:
    name: Terraform static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Validate remote-state bootstrap
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false
          terraform -chdir=infra/terraform/bootstrap validate

      - name: Validate dev root
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

  container:
    name: Build and scan container
    if: github.event_name == 'pull_request' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build immutable candidate
        run: docker build --pull --tag "testsnakesaas:${GITHUB_SHA}" .

      - name: Scan candidate for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: testsnakesaas:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  plan_pull_request:
    name: Terraform dev plan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: us-east-1
      TF_VAR_environment: dev
      TF_VAR_project_name: testsnakesaas
      TF_VAR_domain_name: ${{ vars.DEV_DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.DEV_ROUTE53_ZONE_ID }}
      TF_VAR_cognito_domain_prefix: ${{ vars.DEV_COGNITO_DOMAIN_PREFIX }}
      TF_VAR_image_tag: ${{ github.event.pull_request.head.sha }}
      TF_VAR_state_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
      TF_VAR_state_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VAR_state_key: testsnakesaas/dev/terraform.tfstate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to AWS with pull-request OIDC role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: pr-${{ github.event.pull_request.number }}-terraform-plan
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Initialize encrypted remote state
        run: >-
          terraform -chdir=infra/terraform init -reconfigure
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET_NAME }}"
          -backend-config="key=testsnakesaas/dev/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
          -backend-config="use_lockfile=true"

      - name: Create review-only plan
        run: terraform -chdir=infra/terraform plan -lock=false -out=dev.tfplan

      - name: Add plan to job summary
        run: terraform -chdir=infra/terraform show -no-color dev.tfplan >> "$GITHUB_STEP_SUMMARY"

  apply_dev:
    name: Approval-gated dev apply or rollback
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.validate.result == 'success' &&
      (needs.container.result == 'success' || needs.container.result == 'skipped')
    needs: [validate, container]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: us-east-1
      TF_VAR_environment: dev
      TF_VAR_project_name: testsnakesaas
      TF_VAR_domain_name: ${{ vars.DEV_DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.DEV_ROUTE53_ZONE_ID }}
      TF_VAR_cognito_domain_prefix: ${{ vars.DEV_COGNITO_DOMAIN_PREFIX }}
      TF_VAR_state_bucket_arn: ${{ vars.TF_STATE_BUCKET_ARN }}
      TF_VAR_state_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VAR_state_key: testsnakesaas/dev/terraform.tfstate
      ECR_REPOSITORY: testsnakesaas-dev-web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select immutable image tag
        shell: bash
        run: |
          if [[ "${{ inputs.mode }}" == "rollback" ]]; then
            IMAGE_SHA="${{ inputs.image_sha }}"
          else
            IMAGE_SHA="${GITHUB_SHA}"
          fi
          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be a full lowercase 40-character Git commit SHA." >&2
            exit 1
          fi
          echo "IMAGE_SHA=$IMAGE_SHA" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=$IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to AWS exclusively with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: dev-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Initialize encrypted remote state
        run: >-
          terraform -chdir=infra/terraform init -reconfigure
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET_NAME }}"
          -backend-config="key=testsnakesaas/dev/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="encrypt=true"
          -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
          -backend-config="use_lockfile=true"

      - name: Require ECR to be bootstrapped
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --output json > /dev/null

      - name: Confirm rollback image exists
        if: inputs.mode == 'rollback'
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_SHA" \
            --region "$AWS_REGION" \
            --output json > /dev/null

      - name: Build deploy image after approval
        if: inputs.mode == 'deploy'
        run: docker build --pull --tag "testsnakesaas:${IMAGE_SHA}" .

      - name: Scan the exact deploy image after approval
        if: inputs.mode == 'deploy'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: testsnakesaas:${{ env.IMAGE_SHA }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push immutable commit tag to ECR
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "testsnakesaas:${IMAGE_SHA}" "$REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA"

      - name: Create exact dev plan
        run: terraform -chdir=infra/terraform plan -lock-timeout=5m -out=dev.tfplan

      - name: Add exact plan to approval run summary
        run: terraform -chdir=infra/terraform show -no-color dev.tfplan >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the reviewed plan
        run: terraform -chdir=infra/terraform apply -lock-timeout=5m dev.tfplan

      - name: Verify ECS steady state and health endpoint
        shell: bash
        run: |
          CLUSTER="$(terraform -chdir=infra/terraform output -raw ecs_cluster_name)"
          SERVICE="$(terraform -chdir=infra/terraform output -raw ecs_service_name)"
          URL="$(terraform -chdir=infra/terraform output -raw application_url)"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION"
          curl --fail --show-error --silent --retry 6 --retry-delay 10 "$URL/api/health"
